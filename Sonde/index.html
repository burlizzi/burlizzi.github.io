<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SondeHub Hunter</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 16px;
      background: var(--bg); color: var(--text);
      max-width: 640px; margin-inline: auto;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; border-bottom: 1px solid #334155; padding-bottom: 12px;
    }
    h1 { font-size: 1.3rem; margin: 0; color: var(--accent); }
    .controls {
      display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap;
    }
    select, button.refresh {
      background: var(--card); color: var(--text);
      border: 1px solid #334155; padding: 10px 14px;
      border-radius: 8px; font-size: 0.95rem;
    }
    button.refresh {
      background: var(--accent); color: #0f172a; font-weight: 700;
      border: none; cursor: pointer; flex: 1;
    }
    button.refresh:disabled { opacity: 0.5; }
    .info-box {
      background: var(--card);
      border: 1px solid #38bdf855;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
    }
    .info-box .info-title {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .info-box code {
      font-size: 0.78rem;
      color: var(--muted);
      word-break: break-all;
    }
    .status {
      font-size: 0.85rem; color: var(--muted);
      margin-bottom: 14px; background: var(--card);
      padding: 10px 12px; border-radius: 8px;
    }
    .card {
      background: var(--card); border-radius: 12px;
      padding: 16px; margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .card.closest { border-color: var(--success); border-width: 2px; }
    .card.has-recovery {
      background: linear-gradient(180deg, var(--danger-bg) 0%, var(--card) 55%);
      border-color: var(--danger);
      border-width: 2px;
    }
    .card.has-recovery .serial,
    .card.has-recovery .recovery-label {
      color: #fca5a5;
    }
    .badge {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      padding: 3px 8px; border-radius: 99px; margin-bottom: 8px; margin-right: 6px;
      background: var(--success); color: #052e16;
    }
    .badge.warn {
      background: var(--warn); color: #1c1917;
    }
    .badge.recovery {
      background: var(--danger); color: #ffffff;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .serial { font-size: 1.2rem; font-weight: 700; }
    .dist { font-size: 1.3rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .meta {
      font-size: 0.88rem; color: var(--muted);
      margin: 8px 0 14px 0; line-height: 1.5;
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-nav {
      display: block; text-align: center; text-decoration: none;
      padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    }
    .btn-gmaps { background: var(--success); color: #052e16; }
    .btn-geo { background: #334155; color: var(--text); }
    .card.has-recovery .btn-gmaps {
      background: var(--danger); color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎈 SondeHub Hunter</h1>
    <span id="gps-badge" style="font-size: 0.8rem; color: var(--warn);">GPS in attesa...</span>
  </header>

  <div class="controls">
    <select id="radius">
      <option value="70000">Raggio: 70 km</option>
      <option value="150000" selected>Raggio: 150 km</option>
      <option value="250000">Raggio: 250 km</option>
    </select>
    <select id="lookback-hours">
      <option value="6">Ultime 6h</option>
      <option value="12" selected>Ultime 12h</option>
      <option value="24">Ultime 24h</option>
    </select>
    <button id="btn-scan" class="refresh" onclick="scanSondes()">Aggiorna</button>
  </div>

  <div id="info-box" class="info-box">
    <div class="info-title">ℹ️ Info Riepilogo</div>
    <div id="info-content">In attesa della posizione più recente...</div>
  </div>

  <div id="status" class="status">Richiesta posizione GPS più recente...</div>
  <div id="results"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function requestCurrentPosition(options) {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
      });
    }

    function requestWatchFix(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        let settled = false;
        const watchId = navigator.geolocation.watchPosition(
          pos => {
            if (settled) return;
            settled = true;
            navigator.geolocation.clearWatch(watchId);
            resolve(pos);
          },
          err => {
            if (settled) return;
            settled = true;
            navigator.geolocation.clearWatch(watchId);
            reject(err);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: timeoutMs }
        );

        setTimeout(() => {
          if (settled) return;
          settled = true;
          navigator.geolocation.clearWatch(watchId);
          reject(new Error("Timeout attesa fix GPS recente"));
        }, timeoutMs + 500);
      });
    }

    /**
     * Richiede la posizione più recente possibile:
     * 1) Prova un fix fresco (maximumAge: 0) ad alta precisione.
     * 2) Se non arriva subito, usa watchPosition per catturare il primo aggiornamento fresco.
     * 3) Come ultimo ripiego, accetta una lettura recente (fino a 15s) se il sensore fatica.
     */
    async function getLatestPosition() {
      if (!navigator.geolocation) {
        throw new Error("Geolocalizzazione non supportata dal browser.");
      }

      try {
        return await requestCurrentPosition({
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 8000
        });
      } catch (_) {
        try {
          return await requestWatchFix(7000);
        } catch (err) {
          try {
            return await requestCurrentPosition({
              enableHighAccuracy: false,
              maximumAge: 15000,
              timeout: 6000
            });
          } catch (__ ) {
            throw new Error(err?.message || "Impossibile ottenere una posizione GPS recente.");
          }
        }
      }
    }

    function parseMaybeJsonArray(raw) {
      if (Array.isArray(raw)) return raw;
      if (typeof raw === 'string') {
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : null;
        } catch (_) {
          return null;
        }
      }
      return null;
    }

    function hasNonNullRecovery(entry) {
      if (!entry || typeof entry !== 'object') return false;
      return entry.recovery !== null && entry.recovery !== undefined && entry.recovery !== '';
    }

    function formatRecovery(recovery) {
      if (recovery === null || recovery === undefined) return 'null';
      if (typeof recovery === 'object') return JSON.stringify(recovery);
      return String(recovery);
    }

    function buildSummaryUrl(lat, lon, distanceMeters, lookbackHours) {
      const now = new Date();
      const fromDate = new Date(now.getTime() - lookbackHours * 3600 * 1000);
      const params = new URLSearchParams({
        lat: String(lat),
        lon: String(lon),
        distance: String(distanceMeters),
        from: fromDate.toISOString(),
        to: now.toISOString(),
        predictions_only: "true"
      });
      return {
        url: `https://api.v2.sondehub.org/sondes/summary?${params.toString()}`,
        fromIso: fromDate.toISOString(),
        toIso: now.toISOString()
      };
    }

    function extractLandingInfo(entry) {
      const pred = entry.predicted_landing;
      if (pred && typeof pred === 'object') {
        const lat = typeof pred.lat === 'number' ? pred.lat : pred.latitude;
        const lon = typeof pred.lon === 'number' ? pred.lon : pred.longitude;
        const alt = typeof pred.alt === 'number' ? Math.round(pred.alt) : null;
        if (typeof lat === 'number' && typeof lon === 'number' && !Number.isNaN(lat) && !Number.isNaN(lon)) {
          return { lat, lon, alt, hasPrediction: true };
        }
      }

      const track = parseMaybeJsonArray(entry.data)
        || (Array.isArray(entry.summary) ? entry.summary : null);

      if (Array.isArray(track) && track.length > 0) {
        const last = track[track.length - 1];
        const lat = typeof last.latitude === 'number' ? last.latitude : last.lat;
        const lon = typeof last.longitude === 'number' ? last.longitude : last.lon;
        const alt = typeof last.alt === 'number' ? Math.round(last.alt) : null;
        if (typeof lat === 'number' && typeof lon === 'number' && !Number.isNaN(lat) && !Number.isNaN(lon)) {
          return { lat, lon, alt, hasPrediction: false };
        }
      }

      return null;
    }

    async function scanSondes() {
      const btn = document.getElementById('btn-scan');
      const status = document.getElementById('status');
      const infoContent = document.getElementById('info-content');
      const resultsDiv = document.getElementById('results');
      const radiusMeters = Number(document.getElementById('radius').value);
      const lookbackHours = Number(document.getElementById('lookback-hours').value);
      const gpsBadge = document.getElementById('gps-badge');

      btn.disabled = true;
      resultsDiv.innerHTML = '';

      try {
        status.textContent = "Richiesta posizione GPS più recente...";
        const pos = await getLatestPosition();
        const coords = pos.coords;
        const userLat = coords.latitude;
        const userLon = coords.longitude;
        const accMeters = typeof coords.accuracy === 'number' ? Math.round(coords.accuracy) : null;
        const fixAgeSec = typeof pos.timestamp === 'number'
          ? Math.max(0, Math.round((Date.now() - pos.timestamp) / 1000))
          : 0;

        gpsBadge.textContent = `GPS: ${userLat.toFixed(4)}, ${userLon.toFixed(4)} (±${accMeters ?? '?'}m)`;
        gpsBadge.style.color = '#22c55e';

        const { url, fromIso, toIso } = buildSummaryUrl(userLat, userLon, radiusMeters, lookbackHours);
        status.textContent = "Interrogazione SondeHub summary...";

        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const radiosondesObj = data && typeof data === 'object' && data.radiosondes && typeof data.radiosondes === 'object'
          ? data.radiosondes
          : (data && typeof data === 'object' ? data : {});

        const items = [];

        for (const [serialKey, entry] of Object.entries(radiosondesObj)) {
          if (!entry || typeof entry !== 'object') continue;

          const summaryArr = Array.isArray(entry.summary) ? entry.summary : [];
          const latestPoint = summaryArr.length > 0 ? summaryArr[summaryArr.length - 1] : {};
          const serial = latestPoint.serial || serialKey;
          const type = latestPoint.type || entry.type || 'Sonda';
          const manufacturer = latestPoint.manufacturer ? ` · ${latestPoint.manufacturer}` : '';
          const currAlt = typeof latestPoint.alt === 'number' ? Math.round(latestPoint.alt) : null;
          const velV = typeof latestPoint.vel_v === 'number' ? latestPoint.vel_v.toFixed(1) : null;
          const recoveryActive = hasNonNullRecovery(entry);

          const landing = extractLandingInfo(entry);
          if (!landing) continue;

          const distKm = haversineKm(userLat, userLon, landing.lat, landing.lon);

          items.push({
            serial,
            type: `${type}${manufacturer}`,
            currAlt,
            velV,
            landAlt: landing.alt,
            targetLat: landing.lat,
            targetLon: landing.lon,
            hasPrediction: landing.hasPrediction,
            recoveryActive,
            recoveryText: formatRecovery(entry.recovery),
            distKm
          });
        }

        items.sort((a, b) => a.distKm - b.distKm);

        const recoveryCount = items.filter(x => x.recoveryActive).length;
        const metaLimits = data?._metadata?.limits
          ? `predLimit=${data._metadata.limits.predictions}, totalLimit=${data._metadata.limits.total}`
          : 'limits=N/D';
        const nowLocal = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        infoContent.innerHTML = `
          <div><b>Sonde trovate:</b> ${items.length} &nbsp;|&nbsp; <b style="color:#fca5a5;">Con recovery != null:</b> ${recoveryCount}</div>
          <div><b>Posizione più recente:</b> ${userLat.toFixed(5)}, ${userLon.toFixed(5)} (età fix: ${fixAgeSec}s, prec.: ±${accMeters ?? '?'}m)</div>
          <div><b>Raggio:</b> ${(radiusMeters / 1000).toFixed(0)} km &nbsp;|&nbsp; <b>Finestra (UTC):</b> ${fromIso} → ${toIso}</div>
          <div><b>Metadata:</b> ${metaLimits} &nbsp;|&nbsp; <b>Aggiornato:</b> ${nowLocal}</div>
          <div><code>${url}</code></div>
        `;

        if (items.length === 0) {
          status.textContent = "Nessuna previsione di atterraggio trovata nell'intervallo e raggio selezionati.";
          btn.disabled = false;
          return;
        }

        status.textContent = `Aggiornato alle ${nowLocal} — ${items.length} sonde ordinate per distanza.`;

        items.forEach((s, idx) => {
          const isClosest = idx === 0;
          const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.targetLat},${s.targetLon}`;
          const geoUrl = `geo:${s.targetLat},${s.targetLon}?q=${s.targetLat},${s.targetLon}(Sonda+${encodeURIComponent(s.serial)})`;

          const cardClasses = ['card'];
          if (s.recoveryActive) cardClasses.push('has-recovery');
          else if (isClosest) cardClasses.push('closest');

          const card = document.createElement('div');
          card.className = cardClasses.join(' ');
          card.innerHTML = `
            ${s.recoveryActive ? '<div class="badge recovery">RECOVERY ATTIVO</div>' : ''}
            ${isClosest ? '<div class="badge">PIÙ VICINA</div>' : ''}
            ${!s.hasPrediction ? '<div class="badge warn">DA TRAIETTORIA</div>' : ''}
            <div class="card-header">
              <span class="serial">${s.serial} <small style="color:var(--muted);font-weight:400;">(${s.type})</small></span>
              <span class="dist">${s.distKm.toFixed(1)} km</span>
            </div>
            <div class="meta">
              ${s.landAlt !== null ? `Quota atterraggio prevista: <b>${s.landAlt} m</b><br>` : ''}
              ${s.currAlt !== null ? `Ultima quota nota: <b>${s.currAlt} m</b>${s.velV !== null ? ` (Vel. V: ${s.velV} m/s)` : ''}<br>` : ''}
              <span class="recovery-label">Recovery: <b>${s.recoveryText}</b></span><br>
              Coordinate atterraggio: <code>${s.targetLat.toFixed(5)}, ${s.targetLon.toFixed(5)}</code>
            </div>
            <div class="actions">
              <a class="btn-nav btn-gmaps" href="${gmapsUrl}" target="_blank" rel="noopener">Google Maps</a>
              <a class="btn-nav btn-geo" href="${geoUrl}">Altra App (OsmAnd)</a>
            </div>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (err) {
        status.textContent = err?.message || String(err);
        infoContent.innerHTML = `<div>Impossibile completare il riepilogo. Verifica i permessi di geolocalizzazione e la connessione di rete.</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    window.addEventListener('load', scanSondes);
  </script>
</body>
</html>
